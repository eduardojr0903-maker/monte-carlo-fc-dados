name: Odds da Bet365 (OddsPapi)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/odds.yml", "scraper/autobets.py"]
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: node scraper/model_run.js 60 20000
      - name: Odds
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_FORCE: "1"
        run: python scraper/upcoming_odds.py
      - name: Robô
        run: python scraper/autobets.py
      - name: Resultados para liquidar as apostas no app
        run: python scraper/results_doc.py
      - name: Resumo da resposta (sem a chave)
        run: |
          python - <<'PY'
          import json, os
          p = "data/odds/upcoming/oddspapi_bet365.json"
          if not os.path.exists(p):
              print("sem arquivo de odds"); raise SystemExit
          d = json.load(open(p))
          fx = d["data"] if isinstance(d["data"], list) else d["data"].get("data", [])
          print("jogos", len(fx))
          if fx:
              f = fx[0]
              print("campos do jogo:", list(f.keys()))
              bo = f.get("bookmakerOdds") or {}
              print("casas:", list(bo.keys()))
              for b, v in bo.items():
                  print(b, "mercados:", len(v.get("markets") or {}))
          PY
      - name: Salvar
        if: always()
        run: |
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data/odds data/model data/autobets data/db/results.json
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Robô de apostas: odds da Bet365 (OddsPapi) $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Robô de apostas $(date -u +'%Y-%m-%d %H:%M') UTC"; }
            sleep 5
          done
          exit 1
