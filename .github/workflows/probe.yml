name: Testar fontes
on:
  push:
    paths: ["scraper/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi
      - run: python scraper/probe.py
      - run: |
          git config user.name "monte-carlo-fc-bot"; git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data/probe.json; git commit -m "Teste de fontes" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
