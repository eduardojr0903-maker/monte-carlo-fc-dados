name: Fotos dos jogadores

on:
  schedule:
    - cron: "41 4 * * 1"   # segunda, 1h41 em Brasília
  workflow_dispatch:
  push:
    paths:
      - "scraper/photos.py"
      - ".github/workflows/photos.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fotos
        run: python scraper/photos.py
      - name: Salvar
        if: always()
        run: |
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data/photos data/cache/photos
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Fotos dos jogadores $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Fotos dos jogadores $(date -u +'%Y-%m-%d %H:%M') UTC"; }
            sleep 5
          done
          exit 1
