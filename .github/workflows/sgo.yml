name: Teste SportsGameOdds
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sgo.yml", "scraper/sgo_probe.py"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
        run: python scraper/sgo_probe.py
      - name: Salvar
        run: |
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data/odds/sgo
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Teste SportsGameOdds: mercados da Bet365"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Teste SportsGameOdds"; }
            sleep 5
          done
          exit 1
