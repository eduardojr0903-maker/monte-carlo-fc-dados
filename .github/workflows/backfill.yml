name: Carregar histórico
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/backfill.yml", "scraper/backfill_rich.py"]
permissions:
  contents: write
jobs:
  league:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lid: [57, 61]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/backfill.py ${{ matrix.lid }}
      - run: python scraper/backfill_rich.py ${{ matrix.lid }}
      - uses: actions/upload-artifact@v4
        with:
          name: rich-${{ matrix.lid }}
          path: data/cache/rich/${{ matrix.lid }}_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.lid }}
          path: data/cache/history_full/${{ matrix.lid }}_*.json
  save:
    needs: league
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Odds históricas
        run: python scraper/odds.py
      - name: Salvar
        run: |
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          mkdir -p data/cache/rich
          for i in 1 2 3 4 5; do
            git pull --rebase -X ours origin main || git rebase --abort
            mkdir -p data/cache/history_full
            find artifacts -path '*rich-*' -name '*.json' -exec cp {} data/cache/rich/ \;
            find artifacts -path '*full-*' -name '*.json' -exec cp {} data/cache/history_full/ \;
            git add data/cache/rich data/cache/history_full data/odds
            git diff --cached --quiet && exit 0
            git commit -m "Histórico detalhado (mapa de chutes, gols, expulsões, jogadores) e odds"
            git push && exit 0
            sleep 10
          done
          exit 1
