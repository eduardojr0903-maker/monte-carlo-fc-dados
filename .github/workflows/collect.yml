name: Coletar dados

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Coletar
        run: python scraper/collect.py
      - name: Salvar dados no repositório
        run: |
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Dados atualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
