name: Coletar dados

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Calendário (copas, continentais, estaduais) da temporada atual
        continue-on-error: true
        timeout-minutes: 20
        run: python scraper/calendar_collect.py --current
      - name: Coletar
        run: python scraper/collect.py
      - name: Odds de fechamento da temporada atual
        continue-on-error: true
        run: python scraper/odds.py --current
      - name: Robô de apostas · simular os próximos jogos
        continue-on-error: true
        run: node scraper/model_run.js 60 20000
      - name: Robô de apostas · odds da Bet365
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scraper/upcoming_odds.py
      - name: Robô de apostas · filtrar VE ≥ 5% e registrar
        continue-on-error: true
        run: python scraper/autobets.py
      - name: Resultados para liquidar as apostas no app
        continue-on-error: true
        run: python scraper/results_doc.py
      - name: Salvar dados no repositório
        if: always()
        run: |
          set -x
          git config user.name "monte-carlo-fc-bot"
          git config user.email "monte-carlo-fc-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Dados atualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Dados atualizados $(date -u +'%Y-%m-%d %H:%M') UTC"; }
            sleep 5
          done
          exit 1
